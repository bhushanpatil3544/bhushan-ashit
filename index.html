<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MPSC & RRB NTPC महा-अकादमी | संपूर्ण डिजिटल शिक्षण व्यासपीठ</title>
  <meta name="description" content="MPSC (राज्यसेवा, संयुक्त गट ब/क) व RRB NTPC साठी संपूर्ण अभ्यासक्रम, सखोल १४-घटक अध्यापन, पडताळलेले PYQs, ५४०+ MCQs आणि ३D फ्लॅशकार्ड्स.">

  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="css/style.css">

  <!-- Mobile Responsive Sidebar Overrides -->
  <style>
    @media (max-width: 900px) {
      aside.app-sidebar {
        position: fixed;
        left: -320px;
        top: var(--header-h);
        bottom: 0;
        z-index: 999;
        transition: left 0.3s ease;
        box-shadow: var(--shadow-lg);
      }
      aside.app-sidebar.open {
        left: 0;
      }
      .mobile-menu-btn {
        display: inline-flex !important;
      }
      .header-search {
        display: none !important;
      }
    }
    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      font-size: 1.2rem;
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="brand-section">
      <button class="mobile-menu-btn" onclick="window.AppRouter.toggleMobileSidebar()" title="अभ्यासक्रम मेनू उघडा">☰</button>
      <div class="brand-logo" onclick="window.AppRouter.openDashboard()" style="cursor: pointer;">🎓</div>
      <div onclick="window.AppRouter.openDashboard()" style="cursor: pointer;">
        <div class="brand-title">MPSC & RRB NTPC महा-अकादमी</div>
        <div class="brand-sub">महाराष्ट्र लोकसेवा आयोग व रेल्वे भरती बोर्ड डिजिटल अभ्यासक्रम</div>
      </div>
    </div>

    <!-- Global Search -->
    <div class="header-search" style="position: relative;">
      <span class="search-icon">🔍</span>
      <input type="text" id="global-search-input" placeholder="घटक, विषय किंवा प्रश्न शोधा..." oninput="window.AppRouter.handleGlobalSearch(this.value)">
      <!-- Dropdown Results -->
      <div id="global-search-results" style="display: none; position: absolute; top: 38px; left: 0; width: 340px; background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); z-index: 1100; max-height: 400px; overflow-y: auto;"></div>
    </div>

    <!-- Header Tools -->
    <div class="header-tools">
      <button class="tool-btn" onclick="window.AppRouter.openDashboard()" title="डॅशबोर्ड">🏠 मुख्य</button>
      <button class="tool-btn" onclick="window.AppRouter.openPractice()" title="५४० MCQs प्रॅक्टिस लॅब">✍️ सराव लॅब</button>
      <button class="tool-btn" onclick="window.AppRouter.adjustFontSize(-1)" title="फॉन्ट लहान करा">A-</button>
      <button class="tool-btn" onclick="window.AppRouter.adjustFontSize(1)" title="फॉन्ट मोठा करा">A+</button>
      <button class="tool-btn" onclick="window.AppRouter.toggleTheme()" title="थीम बदला">🌓</button>
    </div>
  </header>

  <!-- App Main Layout -->
  <div class="app-body">

    <!-- Sidebar: Complete Syllabus Tree -->
    <aside class="app-sidebar" id="sidebar-panel">
      <div id="syllabus-sidebar-tree">
        <!-- Dynamically rendered by AppRouter -->
        <div style="padding: 20px; text-align: center; color: var(--text-muted);">
          अभ्यासक्रम लोड होत आहे...
        </div>
      </div>
    </aside>

    <!-- Main Content Area: Dashboard / Lesson / Practice -->
    <main class="main-content" id="main-content-view" style="flex: 1; padding: 24px 30px; max-width: 1200px; margin: 0 auto; width: 100%;">
      <!-- Dynamic Views Injected Here -->
      <div style="text-align: center; padding: 60px;">
        <div style="font-size: 2rem;">⏳</div>
        <p style="margin-top: 10px; color: var(--text-muted);">डिजिटल महा-अकादमी सुरू होत आहे...</p>
      </div>
    </main>

  </div>

  <!-- Application Data Stores (Global Objects for 100% offline & file:// compatibility) -->
  <script src="data/taxonomy.js"></script>
  <script src="data/lessons.js"></script>
  <script src="data/mcqs_bank.js"></script>

  <!-- Application Feature Engines -->
  <script src="js/dashboard.js"></script>
  <script src="js/lesson-engine.js"></script>
  <script src="js/practice-engine.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
